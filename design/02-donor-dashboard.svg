<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="BloodBridge animated donor dashboard">
<title>BloodBridge animated donor dashboard</title>
<defs>
 <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1F3"/><stop offset="1" stop-color="#FFE2E8"/></linearGradient>
 <linearGradient id="redGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F45D73"/><stop offset="1" stop-color="#C52548"/></linearGradient>
 <linearGradient id="navyGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#193A50"/><stop offset="1" stop-color="#10293D"/></linearGradient>
 <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DA3755" stop-opacity=".22"/><stop offset="1" stop-color="#DA3755" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#1C3955" flood-opacity=".07"/></filter>
 <filter id="shadow2" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#C42C48" flood-opacity=".10"/></filter>
</defs>

<style><![CDATA[
text { font-family: Inter, 'Segoe UI', Arial, sans-serif; letter-spacing: -.2px; }
@keyframes float {0%,100% {transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes floatB {0%,100% {transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes pulse {0%,100%{opacity:.25;transform:scale(.95)}50%{opacity:.65;transform:scale(1.12)}}
@keyframes glow {0%,100%{opacity:.6}50%{opacity:1}}
@keyframes spin {to{transform:rotate(360deg)}}
@keyframes dash {to{stroke-dashoffset:-48}}
@keyframes trace {0%{stroke-dashoffset:440}100%{stroke-dashoffset:0}}
@keyframes rise {0%{transform:scaleY(.08);opacity:.4}100%{transform:scaleY(1);opacity:1}}
@keyframes pop {0%{transform:scale(.88);opacity:.5}100%{transform:scale(1);opacity:1}}
@keyframes blink {0%,100%{opacity:1}50%{opacity:.45}}
.float {animation:float 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.floatB {animation:floatB 5.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse {animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glow {animation:glow 2.5s ease-in-out infinite}
.dash {stroke-dasharray:6 8;animation:dash 3s linear infinite}
.trace {stroke-dasharray:440;stroke-dashoffset:440;animation:trace 2.6s ease forwards}
.rise {animation:rise 1.5s cubic-bezier(.22,.68,0,1.1) both;transform-box:fill-box;transform-origin:bottom}
.pop {animation:pop 1.1s ease both;transform-box:fill-box;transform-origin:center}
.blink {animation:blink 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.float,.floatB,.pulse,.glow,.dash,.trace,.rise,.pop,.blink{animation:none!important}}
]]></style>

