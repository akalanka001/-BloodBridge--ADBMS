="url(#redGradient)" /><rect x="1038" y="351" width="132" height="23" rx="8" fill="#F66A7E" /><text x="1104" y="404" font-size="21" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">BLOOD</text><text x="1104" y="430" font-size="12" font-weight="750" fill="#FFEFF1" text-anchor="middle" letter-spacing="2.5">DONATION</text><path d="M1042 460h34l12-17 16 32 16-23h47" stroke="white" stroke-width="3.5" stroke-linejoin="round" fill="none" class="glow"/></g><circle cx="870" cy="269" r="43" fill="#FFFFFF" filter="url(#shadow)" class="floatB"/><g transform="translate(848 247) scale(1.8333)" fill="none" stroke="#DB3654" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></g><circle cx="1308" cy="495" r="36" fill="#FFFFFF" filter="url(#shadow)" class="floatB"/><g transform="translate(1289 474) scale(1.6667)" fill="none" stroke="#DB3654" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C9 6.7 5 10.7 5 15a7 7 0 0 0 14 0c0-4.3-4-8.3-7-13z"/></g><g class="floatB"><rect x="802" y="515" width="231" height="93" rx="17" fill="white" filter="url(#shadow)"/><circle cx="834" cy="546" r="16" fill="#E4F7F3" /><g transform="translate(824 536) scale(0.8333)" fill="none" stroke="#16A085" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></g><text x="862" y="546" font-size="14" font-weight="750" fill="#1D3043" >Request connected</text><text x="862" y="571" font-size="11" font-weight="400" fill="#7A8B9E" >Coordinated care network</text></g><g class="float"><rect x="1176" y="165" width="168" height="80" rx="16" fill="white" filter="url(#shadow)"/><circle cx="1205" cy="196" r="17" fill="#FDE9EF" /><g transform="translate(1195 185) scale(0.8333)" fill="none" stroke="#DB3654" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></g><text x="1231" y="194" font-size="12" font-weight="650" fill="#7A8B9E" >Nearby help</text><text x="1231" y="215" font-size="12" font-weight="750" fill="#1D3043" >Donor network</text></g><text x="719" y="747" font-size="27" font-weight="800" fill="#1D3043" text-anchor="middle" >One connected platform. Four essential roles.</text><text x="719" y="775" font-size="14" font-weight="450" fill="#7A8B9E" text-anchor="middle" >Made for the people who give, request, manage, and coordinate blood support.</text><rect x="66" y="806" width="312" height="154" rx="19" fill="white" stroke="#E8ECF2" stroke-width="1" filter="url(#shadow)"/><rect x="86" y="827" width="52" height="52" rx="14" fill="#FFF0F2" /><g transform="translate(100 841) scale(1.0000)" fill="none" stroke="#DB3654" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></g><text x="86" y="910" font-size="17" font-weight="750" fill="#1D3043" >Blood donors</text><text x="86" y="933" font-size="12" font-weight="400" fill="#7A8B9E" >Be part of the change.</text><rect x="398" y="806" width="312" height="154" rx="19" fill="white" stroke="#E8ECF2" stroke-width="1" filter="url(#shadow)"/><rect x="418" y="827" width="52" height="52" rx="14" fill="#FFF0F2" /><g transform="translate(432 841) scale(1.0000)" fill="none" stroke="#DB3654" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 6v8M8 10h8M8 21v-5h8v5"/></g><text x="418" y="910" font-size="17" font-weight="750" fill="#1D3043" >Hospital teams</text><text x="418" y="933" font-size="12" font-weight="400" fill="#7A8B9E" >Coordinate blood requests.</text><rect x="730" y="806" width="312" height="154" rx="19" fill="white" stroke="#E8ECF2" strok