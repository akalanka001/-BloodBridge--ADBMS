<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="BloodBridge concept A · editorial landing page">
<title>BloodBridge concept A · editorial landing page</title>
<defs>
 <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243F51"/><stop offset="1" stop-color="#102A3A"/></linearGradient>
 <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FA718B"/><stop offset="1" stop-color="#CA2449"/></linearGradient>
 <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1F3"/><stop offset="1" stop-color="#FFE0E8"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D93455" stop-opacity=".17"/><stop offset="1" stop-color="#D93455" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="-30%" y="-35%" width="180%" height="200%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#112D41" flood-opacity=".10"/></filter>
 <filter id="smshadow" x="-30%" y="-35%" width="180%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#112D41" flood-opacity=".07"/></filter>
 </defs>
 <style><![CDATA[
 text {font-family:Inter,'Segoe UI',Arial,sans-serif;letter-spacing:-.25px}
 @keyframes hover {0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
 @keyframes hover2 {0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
 @keyframes heartbeat{0%,100%{transform:scale(1)}30%{transform:scale(1.07)}55%{transform:scale(.98)}}
 @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
 @keyframes stroke{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
 @keyframes up {from{transform:scaleY(.15);opacity:.4}to{transform:scaleY(1);opacity:1}}
 @keyframes shift{to{stroke-dashoffset:-48}}
 @keyframes fadeUp{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
 .hover{animation:hover 5.5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
 .hover2{animation:hover2 4.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
 .beat{animation:heartbeat 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .twinkle{animation:twinkle 2.7s ease-in-out infinite}
 .flow{stroke-dasharray:7 9;animation:shift 3.2s linear infinite}
 .up{animation:up 1.4s ease both;transform-origin:bottom;transform-box:fill-box}
 .enter{animation:fadeUp .8s ease both}
 .stroke{stroke-dasharray:120;stroke-dashoffset:120;animation:stroke 2s ease forwards}
 @media(prefers-reduced-motion:reduce){.hover,.hover2,.beat,.twinkle,.flow,.up,.enter,.stroke{animation:none!important}}
 ]]></style>
