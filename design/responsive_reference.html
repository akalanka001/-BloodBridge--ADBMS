function footer(){return `<footer class="site-footer"><div class="container"><div class="footergrid"><div>${logo()}<p>Connecting donors, hospitals, and blood banks through clearer, more accountable coordination.</p><span class="tag">Academic project · No clinical deployment</span></div><div><h4>Explore</h4><a href="#home">Home</a><a href="#about">About BloodBridge</a><a href="#camps">Donation camps</a><a href="#register">Become a donor</a></div><div><h4>Access</h4><a href="#login">Sign in</a><a href="#activate">Staff activation</a><a href="#recover">Reset password</a><a href="#donor">Dashboard previews</a></div></div><div class="footerline"><span>© BloodBridge · University learning prototype</span><span>For demonstration only. Not for clinical or emergency decisions.</span></div></div></footer>`}
function roleArt(icon){return `<span class="icon-tile">${svg(icon,'lg')}</span>`}
function home(){return `${header('home')}<div class="container view"><section class="hero-shell"><div class="hero"><div class="hero-copy"><div class="eyebrow">A connected donation community</div><h1>Every drop matters.<br><span class="red">Every connection counts.</span></h1><p>One thoughtful platform for donors, hospitals, and blood banks to coordinate blood support with clarity, privacy, and care.</p><div class="btnrow"><a href="#register" class="btn primary">Become a donor ${svg('arrow')}</a><a href="#camps" class="btn outline">Explore donation camps ${svg('calendar')}</a></div><div class="hero-trust"><span>${svg('shield','sm')} Privacy-minded workflows</span><span>${svg('check','sm')} Verified institution coordination</span></div></div><div class="hero-visual"><div class="orbit"></div><div class="orbit second"></div><div class="orbit third"></div><div class="hero-main-art"><div class="art-content">${svg('drop')}<strong>BLOODBRIDGE</strong><small>GIVE • CONNECT • SUPPORT</small></div></div><div class="floating-note one"><span class="icon-tile green" style="width:34px;height:34px">${svg('check')}</span><span><b>Connected care</b><small>Across approved institutions</small></span></div><div class="floating-note two"><span class="icon-tile" style="width:34px;height:34px">${svg('heart')}</span><span><b>Donor journey</b><small>Every donation tells a story</small></span></div></div></div></section><section class="section" style="padding-top:65px"><div class="section-heading reveal"><div><div class="eyebrow">Four connected roles</div><h2>One network.<br>Purpose-built experiences.</h2></div><p>Each role sees the right information and actions, without unnecessary complexity or cross-role access.</p></div><div class="grid cols4">${[['Donors','Manage your history and choose when you are ready to be contacted.','heart','donor'],['Hospital teams','Create component requests and monitor authorized coordination.','building','hospital'],['Blood banks','Manage collections, inventory, camps and movements safely.','drop','bank'],['Administrators','Keep institutions and the system accountable.','shield','admin']].map(([t,d,i,r])=>`<a href="#${r}" class="card role-card hoverable reveal">${roleArt(i)}<h3>${t}</h3><p>${d}</p><span style="color:var(--red);font-weight:800;font-size:12px">Explore UI preview ${svg('arrow','sm')}</span></a>`).join('')}</div></section><section class="section" style="padding-top:14px"><div class="section-heading reveal"><div><div class="eyebrow">How BloodBridge works</div><h2>Thoughtful steps.<br>Connected outcomes.</h2></div><p>A clear journey for the person giving blood and the teams coordinating its safe collection and distribution.</p></div><div class="grid cols3">${[['01 / REGISTER','Join the community','Create a donor profile or register through a blood-bank team.'],['02 / DISCOVER','Find opportunities','Explore approved camps or view verified blood-bank locations.'],['03 / COORDINATE','Track with confidence','Authorized teams record screening, inventory and request outcomes.']].map(([n,t,d])=>`<div class="card step reveal"><div class="step-num">${n}</div><h3>${t}</h3><p style="font-size:13px;margin:0">${d}</p></div>`).join('')}</div></section><section class="section" style="padding-top:18px"><div class="section-heading reveal"><div><div class="eyebrow">Donation opportunities</div><h2>Give locally. Help meaningfully.</h2></div><a class="btn outline small" href="#camps">Explore all camps ${svg('arrow','sm')}</a></div><div class="grid cols3">${campCards()}</div></section><div class="cta-band reveal"><div><h2>Ready to become part of the bridge?</h2><p>Create a donor account in a simple, privacy-minded registration flow.</p></div><a href="#register" class="btn primary">Join BloodBridge ${svg('arrow')}</a></div></div>${footer()}`}
function campCards(){return [['Community donation drive','Colombo District','Upcoming','calendar'],['University blood drive','Galle District','Planned','heart'],['Blood bank donor session','Kandy District','Session','building']].map(([title,place,kind,ico],i)=>`<article class="card camp-card hoverable reveal"><div class="camp-art ${i===1?'alt':i===2?'alt2':''}"><span class="tag">Illustrative preview</span><svg viewBox="0 0 240 160" aria-hidden="true"><path d="M30 148V72l80-45 82 45v76" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><path d="M90 148v-42h41v42M78 82h18m21 0h18" stroke="currentColor" stroke-width="8" fill="none"/></svg></div><h3>${title}</h3><p>${svg('map','sm')} ${place}</p><p>${svg('calendar','sm')} Dates shown only when approved data is loaded</p><a href="#camps" class="link" style="display:inline-flex;align-items:center;gap:7px">Explore camps ${svg('arrow','sm')}</a></article>`).join('')}
function about(){return `${header('about')}<div class="container view"><section class="about-hero reveal"><div class="copy"><div class="eyebrow">About BloodBridge</div><h1>Technology that helps<br><span class="red">communities connect.</span></h1><p>BloodBridge is an academic prototype exploring how donors, hospitals, and blood banks can coordinate information through one secure, role-based platform.</p><div class="btnrow"><a href="#register" class="btn primary">Join as a donor ${svg('arrow')}</a><a href="#home" class="btn outline">Back to home</a></div></div></section><section class="section"><div class="section-heading reveal"><div><div class="eyebrow">Our purpose</div><h2>A clearer path from willingness to impact.</h2></div><p>Our project focuses on trustworthy records, transparent workflows, geographic coordination, and appropriate access to sensitive information.</p></div><div class="grid cols3">${[['Mission','Make donation coordination more understandable and connected.','heart'],['Vision','Explore a responsible digital network for the blood donation ecosystem.','spark'],['Principles','Privacy, verification, accountability and human oversight.','shield']].map(([t,d,i])=>`<article class="card value hoverable reveal">${roleArt(i)}<h3>${t}</h3><p>${d}</p></article>`).join('')}</div></section><section class="section" style="padding-top:7px"><div class="section-heading reveal"><div><div class="eyebrow">How the roles connect</div><h2>One process, four perspectives.</h2></div></div><div class="about-flow reveal"><div class="mini">${svg('user')}<b>Donor</b><small>Profile & interest</small></div>${svg('arrow')}<div class="mini">${svg('building')}<b>Blood bank</b><small>Assess & manage</small></div>${svg('arrow')}<div class="mini">${svg('heart')}<b>Hospital</b><small>Request & receive</small></div>${svg('arrow')}<div class="mini">${svg('shield')}<b>Admin</b><small>Verify & oversee</small></div></div></section><section class="section" style="padding-top:8px"><div class="card reveal" style="background:#f3f7fb;padding:30px"><div class="eyebrow">Transparency matters</div><h3>Academic prototype, not clinical service</h3><p style="margin:0;max-width:850px">This reference illustrates an academic BloodBridge system. Clinical assessment, blood compatibility, collection, testing and release require appropriate authorized professionals and verified real-world processes. Demo figures and records must never be mistaken for live emergencies or actual stock availability.</p></div></section></div>${footer()}`}
function field(label,id,type='text',place='',opts={}){return `<div class="fgroup"><label for="${id}">${label}${opts.required?' <span class="required">*</span>':''}</label>${opts.select?`<select id="${id}" ${opts.required?'required':''}>${opts.select.map(([val,name])=>`<option value="${val}">${name}</option>`).join('')}</select>`:`<div class="input-wrap">${opts.icon?svg(opts.icon):''}<input id="${id}" name="${id}" type="${type}" ${opts.required?'required':''} ${opts.minLength?`minlength="${opts.minLength}"`:''} ${opts.icon?'class="icon-input"':''} placeholder="${place}" ${opts.autoComplete?`autocomplete="${opts.autoComplete}"`:''}></div>`}${opts.help?`<span class="micro">${opts.help}</span>`:''}</div>`}
function login(){return `${header('login')}<div class="container auth-zone view"><div class="auth-frame"><div class="auth-aside"><div class="auth-aside-content">${logo()}</div><div class="auth-aside-content"><span class="tag" style="background:#ffffff22;color:#ffe3e8;border:1px solid #ffffff44;margin-bottom:22px">SECURE SHARED SIGN-IN</span><h2>Welcome back to the bridge.</h2><p>One sign-in. The right workspace for your role. Donor, hospital, bank, and administrator accounts share this secure entry point.</p><div class="btnrow" style="margin-top:20px">${svg('shield')} <span style="font-size:12px;color:#d4e0eb">Role access is determined by your authenticated account.</span></div></div><div class="aside-quote">BloodBridge · Privacy-minded academic prototype</div><div class="ghostshape"></div></div><div class="auth-main"><div><span class="tag">${svg('lock','sm')} Secure access</span><h1>Sign in</h1><p>Enter your account details to continue.</p><form data-demo-form="login">${field('Email address','login-email','email','you@example.com',{required:true,icon:'mail',autoComplete:'username'})}<div class="fgroup"><div style="display:flex;align-items:center;justify-content:space-between"><label for="login-pass">Password <span class="required">*</span></label><a href="#recover" class="link">Forgot password?</a></div><div class="input-wrap">${svg('lock')}<input class="icon-input" id="login-pass" type="password" minlength="1" required placeholder="Enter your password" autocomplete="current-password"><button data-action="showpass" type="button" aria-label="Show or hide password" style="position:absolute;right:10px;top:8px;border:0;background:white;color:#77889a;padding:7px">${svg('eye')}</button></div></div><button class="btn primary wide" type="submit" style="margin-top:24px">Sign in to Dashboard ${svg('arrow')}</button></form><p style="text-align:center;margin:24px 0 12px">New donor? <a href="#register" class="link">Create a donor account</a></p><p style="text-align:center">Received a staff invitation? <a href="#activate" class="link">Activate your account</a></p><p class="micro" style="text-align:center;border-top:1px solid var(--line);padding-top:19px;margin-top:22px">Design reference: authentication is not connected here. Demo credentials are intentionally excluded.</p></div></div></div></div>${footer()}`}
function registration(){return `${header('register')}<div class="container register-zone view"><div class="card register-card"><div class="register-head"><div><span class="tag">${svg('heart','sm')} DONOR REGISTRATION</span><h1>Join the BloodBridge<br>community.</h1><p style="margin-bottom:0">A few details help connect you with nearby opportunities. Clinical eligibility is assessed by authorized staff.</p></div><span class="icon-tile" style="flex:none">${svg('heart','lg')}</span></div><div class="note" style="margin-top:22px">${svg('shield','sm')} Registration is not medical clearance. Optional notification consents remain off until you choose them.</div><form data-demo-form="register"><section class="form-section"><h3>${svg('user')} 01 · Account details</h3><p>Create a secure donor account using your own email address.</p><div class="fieldrow">${field('Full name','reg-name','text','Your full name',{required:true})}${field('Email address','reg-email','email','you@example.com',{required:true})}</div><div class="fieldrow">${field('Password','reg-password','password','At least 10 characters',{required:true,minLength:10})}${field('Confirm password','reg-confirm','password','Repeat password',{required:true,minLength:10})}</div><div class="password-strength" aria-hidden="true"><span id="strength"></span></div><p class="micro" id="password-help" style="margin:7px 0 0">Use at least 10 characters, ideally a unique passphrase.</p></section><section class="form-section"><h3>${svg('heart')} 02 · Personal & contact details</h3><p>Medical measurements entered online are self-reported and do not certify eligibility.</p><div class="fieldrow">${field('Phone number (optional)','reg-phone','tel','07X XXX XXXX')}${field('Date of birth (optional)','reg-dob','date','')}</div><div class="fieldrow">${field('Weight in kg (optional)','reg-weight','number','e.g. 58')}${field('Blood group (optional)','reg-blood','','',{select:[['','Unknown / Not sure'],...['O−','O+','A−','A+','B−','B+','AB−','AB+'].map(x=>[x,x])],help:'Self-reported until verified by authorized staff.'})}</div></section><section class="form-section"><h3>${svg('map')} 03 · Your location</h3><p>Use the verified location hierarchy when available; fields can load from the existing geography APIs.</p><div class="fieldrow">${field('Province (verified directory)','reg-province','','',{select:[['','Select province'],['western','Western'],['southern','Southern'],['central','Central']]})}${field('District','reg-district','','',{required:true,select:[['','Select district'],['colombo','Colombo'],['gampaha','Gampaha'],['galle','Galle'],['kandy','Kandy']]})}</div><div class="fieldrow">${field('DS Division (when available)','reg-ds','','',{select:[['','Select DS division'],['maharagama','Maharagama'],['colombo','Colombo']]})}${field('GN Division (when available)','reg-gn','','',{select:[['','Select GN division'],['demo','Example subdivision']]})}</div>${field('Town / locality (optional)','reg-town','text','e.g. Maharagama')}</section><section class="form-section"><h3>${svg('mail')} 04 · Communication preferences</h3><p>You can change your preferences later. All boxes are optional and unchecked by default.</p>${[['contact','I am available to be contacted about donation opportunities.'],['emergency','I consent to emergency donation invitations.'],['camps','Send me information about approved local donation camps.'],['sms','I agree to receive SMS messages.'],['email','I agree to receive email messages.']].map(([id,label])=>`<label class="check-item"><input type="checkbox" id="reg-${id}"><span>${label}</span></label>`).join('')}</section><div class="register-actions"><button type="submit" class="btn primary">Create donor account ${svg('arrow','sm')}</button><a href="#login" class="btn outline">Sign in instead</a></div><p class="micro" style="margin:15px 0 0;text-align:center">Both actions use one horizontal row, with equal 50% columns. Demo only; no account is created here.</p></form></div></div>${footer()}`}
function camps(){return `${header('camps')}<div class="container view section"><div class="eyebrow">Discover donation opportunities</div><h1 style="font-size:48px">Find a donation camp.</h1><p style="max-width:690px">Browse approved sessions and verified blood-bank locations. This preview uses sample cards only, not current schedules.</p><div class="card" style="margin:30px 0"><div class="fieldrow">${field('District','camp-district','','',{select:[['','All districts'],['colombo','Colombo'],['galle','Galle']]})}${field('Date','camp-date','date','')}</div><button type="button" class="btn primary" data-action="design" style="margin-top:17px">Search camps ${svg('search')}</button></div><div class="grid cols3">${campCards()}</div></div>${footer()}`}
function simpleAuth(kind){const cfg={recover:['Reset your password','Enter your email and we’ll send password-reset instructions.','Email address','email'],activate:['Activate staff account','For authorized hospital and blood bank staff only. Use the token from your invitation.','Invitation token','text']};const c=cfg[kind];return `${header()}<div class="container auth-zone view" style="max-width:600px"><div class="card" style="padding:40px"><span class="tag">${svg('lock','sm')} Account security</span><h1 style="font-size:38px;margin:14px 0">${c[0]}</h1><p>${c[1]}</p><form data-demo-form="${kind}">${field(c[2],`${kind}-field`,c[3],kind==='recover'?'you@example.com':'Invitation token',{required:true})}${kind==='activate'?`${field('Full name','active-name','text','Your full name',{required:true})}${field('New password','active-password','password','10+ characters',{required:true,minLength:10})}${field('Confirm password','active-confirm','password','Repeat password',{required:true,minLength:10})}`:''}<button class="btn primary wide" style="margin-top:23px">${kind==='recover'?'Send recovery instructions':'Activate staff account'} ${svg('arrow')}</button></form><p style="text-align:center;margin-top:16px"><a href="#login" class="link">Return to sign in</a></p></div></div>${footer()}`}
function portal(r,sub){const cfg=roles[r]||roles.donor;const current=cfg.menus.some(x=>x[0]===sub)?sub:'overview';let menu=cfg.menus.map(([id,title,icon])=>`<button type="button" data-sub="${id}" class="side-item ${id===current?'active':''}" ${id===current?'aria-current="page"':''}>${svg(icon)} ${title}</button>`).join('');return `<div class="portal view"><aside id="portalside" class="portal-sidebar"><div class="sidebar-top"><a href="#home">${logo()}</a></div><div class="role-eyebrow">${cfg.badge}</div><div class="sidebar-scroll" aria-label="${cfg.label} navigation">${menu}</div><div class="side-bottom"><button data-go="home">${svg('arrow')} Return to public site</button></div></aside><div class="drawer-shade" id="drawerShade" data-action="closeDrawer"></div><div class="portal-area"><header class="portal-topbar"><div style="display:flex;gap:13px;align-items:center"><button type="button" class="btn iconbtn portal-menu-btn" data-action="drawer" aria-label="Open dashboard navigation">${svg('menu')}</button><div><div class="micro">BloodBridge / ${cfg.label}</div><div class="section-ident">${current==='overview'?'Dashboard overview':(sections[r][current]?.[0]||'Overview')}</div></div></div><div class="right"><button data-action="search" class="btn iconbtn" title="Find menu" aria-label="Find menu">${svg('search')}</button><button data-action="notifications" class="btn iconbtn" title="Notifications" aria-label="Notifications">${svg('bell')}</button><span class="avatar" title="Illustrative account">BB</span><span class="searchlabel" style="font-weight:750;font-size:12px">${cfg.name}</span></div></header><main class="portal-content">${current==='overview'?overview(r):portalSub(r,current)}<footer class="portal-footer"><span>BloodBridge · ${cfg.label}</span><span>Reference screens only · No API or operational data connected</span></footer></main></div></div>`}
function overview(r){const c=roles[r];const bars=[30,46,36,69,56,80,64,89,63,78,58,92];return `<div class="portal-title"><div><div class="eyebrow">${c.badge}</div><h1>${r==='donor'?'Welcome to your donor space':r==='hospital'?'Hospital operations':r==='bank'?'Inventory & collections':'Platform overview'}</h1><p>${c.desc}</p></div><button class="btn primary" data-sub="${c.actionMenu||'camps'}">${c.action} ${svg('arrow')}</button></div><div class="grid cols4">${c.kpis.map(([title,num,hint,ico])=>`<article class="card metric"><div class="meta"><span class="micro">${title}</span><span class="icon-tile">${svg(ico)}</span></div><h3>${num}</h3><p>${hint}</p></article>`).join('')}</div><div class="split-panel"><div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px"><h3 style="margin:0">${r==='donor'?'Donation journey':r==='hospital'?'Request activity':r==='bank'?'Component availability':'Blood request trends'}</h3><span class="tag">Illustrative chart</span></div><p style="font-size:12px">Layout example only. Real data should come from the existing PostgreSQL API.</p><div class="chart-wrap">${bars.map((x,i)=>`<div class="bar" style="height:${x}%;animation-delay:${i*.04}s"><span>${i+1}</span></div>`).join('')}</div></div><div class="card"><h3>Quick actions</h3><p style="font-size:12px">Every action opens a purposeful page for your role.</p><div class="list-detail">${c.menus.slice(1,5).map(([id,label,icon])=>`<button class="line" data-sub="${id}" style="border:0;text-align:left;cursor:pointer">${svg(icon)}<span style="flex:1"><strong>${label}</strong><small>Open ${label.toLowerCase()}</small></span>${svg('arrow','sm')}</button>`).join('')}</div></div></div><div class="card" style="margin-top:20px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h3 style="margin:0">${r==='donor'?'Your recent activity':r==='hospital'?'Recent blood requests':r==='bank'?'Inventory activity':'Pending actions'}</h3><p style="font-size:12px;margin:6px 0 0">Example data structure for design review.</p></div><span class="tag">Sample rows</span></div>${table(c.rows)}</div>`}
function table(rows){return `<div class="table-scroll" style="margin-top:16px"><table class="activity-table"><thead><tr><th>Reference</th><th>Details</th><th>Status / action</th><th></th></tr></thead><tbody>${rows.map(row=>`<tr><td style="font-weight:750;color:var(--navy)">${row[0]}</td><td>${row[1]}</td><td><span class="status ${row[3]==='pending'?'pending':row[3]==='alert'?'alert':''}">${row[2]}</span></td><td><button type="button" class="link" data-action="design">Review ${svg('arrow','sm')}</button></td></tr>`).join('')}</tbody></table></div>`}
function portalSub(r,sub){const cfg=sections[r][sub]||[sub,'Component design reference','Search, filters, safe form validation'];const [title,description,hint]=cfg;const special=portalForm(r,sub);return `<div class="portal-title"><div><div class="eyebrow">${roles[r].badge} / ${title}</div><h1>${title}</h1><p>${description}</p></div><button class="btn outline" data-sub="overview">${svg('arrow')} Back to overview</button></div><div class="split-panel"><div class="card"><div style="display:flex;justify-content:space-between;gap:16px;align-items:center"><h3 style="margin:0">${special?'Form & actions':'Records & details'}</h3><span class="tag">${svg('spark','sm')} UI reference</span></div>${special||`<div class="fgroup"><label for="menu-search">Search / filter</label><div class="input-wrap">${svg('search')}<input class="icon-input" id="menu-search" placeholder="Search records, reference or category"></div></div><p class="micro" style="margin-top:10px">Suggested filters: ${hint}</p>${table([['EXAMPLE-001','Illustrative item','Pending','pending'],['EXAMPLE-002','Database-backed data after implementation','Reviewed','good']])}`}</div><div class="card"><h3>Recommended UX details</h3><div class="list-detail">${[['Clear information',`Display only ${r} role-authorized data.`,'shield'],['Reliable actions','Validate forms before database writes.','check'],['Thoughtful feedback','Loading, empty, error and success states.','activity'],['Accessible motion','Subtle hover, focus and page entrance.','spark']].map(([a,b,i])=>`<div class="line">${svg(i)}<span><strong>${a}</strong><small>${b}</small></span></div>`).join('')}</div><div class="note" style="margin-top:20px">Preview-only interactions illustrate design patterns. Implement real behavior against the existing APIs and PostgreSQL constraints.</div></div></div>`}

if(r==='admin'&&sub==='camp-approvals'){f=`${field('Pending camp reference','admin-camp-id','text','Existing camp ID',{required:true})}${field('Decision','admin-camp-decision','','',{required:true,select:[['APPROVED','Approve'],['REJECTED','Reject']]})}${field('Review reason','admin-camp-reason','text','Mandatory on rejection')}`}
if(r==='admin'&&sub==='etl'){f=`${field('Load mode','etl-mode','','',{required:true,select:[['INCREMENTAL','Incremental'],['FULL','Full refresh']]})}<div class="fieldrow">${field('Date from','etl-from','date','')}${field('Date to','etl-to','date','')}</div>`}
if(r==='admin'&&sub==='benchmarks'){f=`${field('Approved benchmark','bench-exp','','',{required:true,select:[['','Choose experiment'],['donor_index','Donor filtering index'],['inventory_index','Inventory query index']]})}${field('Repetitions','bench-reps','number','e.g. 5',{required:true})}`}
return f?`<form data-demo-form="portal" style="margin-top:18px">${f}<div class="btnrow" style="margin-top:24px"><button class="btn primary" type="submit">${r==='admin'&&sub==='etl'?'Trigger preview':'Preview action'} ${svg('arrow')}</button><button class="btn outline" type="button" data-action="design">Reset / cancel</button></div></form>`:''}
function render(){const hash=decodeURIComponent(location.hash.slice(1)||'home');const [page,sub='overview']=hash.split('/');route={page,menu:sub};let html;if(page==='home')html=home();else if(page==='about')html=about();else if(page==='camps')html=camps();else if(page==='login')html=login();else if(page==='register')html=registration();else if(page==='recover'||page==='activate')html=simpleAuth(page);else if(roles[page])html=portal(page,sub);else html=home();document.getElementById('app').innerHTML=html;document.title=`BloodBridge · ${page==='register'?'Donor registration':page==='home'?'Home':page[0].toUpperCase()+page.slice(1)} UI reference`;window.scrollTo({top:0,behavior:'instant'});requestAnimationFrame(()=>{const revealers=document.querySelectorAll('.reveal');if('IntersectionObserver'in window){const ob=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');ob.unobserve(e.target)}})},{threshold:.08});revealers.forEach((e,i)=>{e.style.transitionDelay=Math.min(i%4*70,210)+'ms';ob.observe(e)})}else revealers.forEach(e=>e.classList.add('visible'))});}
window.addEventListener('hashchange',render);document.addEventListener('click',e=>{const nav=e.target.closest('[data-go]');if(nav){location.hash=nav.dataset.go;return}const sub=e.target.closest('[data-sub]');if(sub){location.hash=`${route.page}/${sub.dataset.sub}`;document.getElementById('portalside')?.classList.remove('open');document.getElementById('drawerShade')?.classList.remove('open');return}const action=e.target.closest('[data-action]');if(!action)return;const k=action.dataset.action;if(k==='publicmenu'){document.getElementById('publiclinks')?.classList.toggle('open')}else if(k==='drawer'){document.getElementById('portalside')?.classList.toggle('open');document.getElementById('drawerShade')?.classList.toggle('open')}else if(k==='closeDrawer'){document.getElementById('portalside')?.classList.remove('open');document.getElementById('drawerShade')?.classList.remove('open')}else if(k==='showpass'){const input=action.parentElement.querySelector('input');input.type=input.type==='password'?'text':'password';action.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password')}else if(k==='search'){toast('Open a role-scoped command/search overlay here in the React implementation.')}else if(k==='notifications'){const role=route.page;const menu=roles[role]?.menus.some(x=>x[0]==='notifications')?'notifications':'notification-monitoring';location.hash=`${role}/${menu}`}else if(k==='design')demoNotice();});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-demo-form]');if(!f)return;e.preventDefault();if(f.dataset.demoForm==='register'){const p=document.getElementById('reg-password')?.value||'',c=document.getElementById('reg-confirm')?.value||'';if(p!==c){toast('Passwords must match. No account was created.');return}const d=document.getElementById('reg-district')?.value;if(!d){toast('Please select a district.');return}}demoNotice()});document.addEventListener('input',e=>{if(e.target.id==='reg-password'){const p=e.target.value;const strength=document.getElementById('strength');if(strength){const score=Math.min(100,(p.length/16)*75+(/[0-9]/.test(p)?12:0)+(/[!@#$%]/.test(p)?13:0));strength.style.width=score+'%';strength.style.background=score>85?'#16866c':score>55?'#d39936':'#db3654'}}});render();
</script>
