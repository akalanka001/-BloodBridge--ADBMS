name: BloodBridge CD Pipeline (GHCR Package Publishing)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA and repository lowercase name
        id: meta
        run: |
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "repo_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/backend:dev
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/backend:${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/backend:${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/frontend:dev
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/frontend:${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/frontend:${{ github.sha }}

      - name: Generate deployment run summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 📦 BloodBridge GHCR Container Images Published

          The following development images were successfully built and pushed to GitHub Container Registry:

          ### Backend API
          - `ghcr.io/${{ steps.meta.outputs.repo_lower }}/backend:dev`
          - `ghcr.io/${{ steps.meta.outputs.repo_lower }}/backend:${{ steps.meta.outputs.sha_short }}`

          ### Frontend Web
          - `ghcr.io/${{ steps.meta.outputs.repo_lower }}/frontend:dev`
          - `ghcr.io/${{ steps.meta.outputs.repo_lower }}/frontend:${{ steps.meta.outputs.sha_short }}`

          ### Image Pull Commands
          ```bash
          docker pull ghcr.io/${{ steps.meta.outputs.repo_lower }}/backend:dev
          docker pull ghcr.io/${{ steps.meta.outputs.repo_lower }}/frontend:dev
          ```

          ### Deployment Prerequisites
          1. **Database:** Deploy PostgreSQL 16 instance and apply migrations (`001_schema.sql`, `002_seed_reference.sql`, `007_advanced_objects.sql`, `010_runtime_privileges.sql`).
          2. **Environment Variables:** Provide secure production values for `POSTGRES_USER`, `POSTGRES_PASSWORD`, `POSTGRES_DB`, `PGHOST`, `PGPORT`, `JWT_SECRET`, and `PORT`.
          3. **Security:** No secrets or synthetic database dumps are embedded within the published images.
          EOF
