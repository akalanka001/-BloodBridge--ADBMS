components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          properties:
            code: &id001
              type: string
            message: *id001
            details:
              type: object
    Ok:
      type: object
      properties:
        data:
          type: object
        meta:
          type: object
    Auth:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    DonorRegister:
      type: object
      required:
      - fullName
      - email
      - password
      - districtCode
      properties:
        fullName: *id001
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone: *id001
        bloodTypeCode: *id001
        districtCode: *id001
        dsCode: *id001
        availableForContact:
          type: boolean
        campNotificationsOptIn:
          type: boolean
    Token:
      type: object
      properties:
        accessToken: *id001
        tokenType:
          type: string
          example: Bearer
        user:
          type: object
    DonorPatch:
      type: object
      properties:
        districtCode: *id001
        dsCode: *id001
        availableForContact:
          type: boolean
        campNotificationsOptIn:
          type: boolean
    BloodRequestCreate:
      type: object
      required:
      - hospitalId
      - urgency
      - neededBy
      - items
      properties:
        hospitalId:
          type: integer
        urgency:
          type: string
          enum:
          - ROUTINE
          - URGENT
          - CRITICAL
        neededBy:
          type: string
          format: date-time
        notes: *id001
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - bloodTypeCode
            - componentCode
            - unitsRequested
            properties:
              bloodTypeCode: *id001
              componentCode: *id001
              unitsRequested:
                type: integer
                minimum: 1
    DonationCreate:
      type: object
      required:
      - donorId
      - collectedAt
      properties:
        donorId:
          type: string
          format: uuid
        collectedAt:
          type: string
          format: date-time
        campId:
          type: string
          format: uuid
        collectedVolumeMl:
          type: integer
    UnitCreate:
      type: object
      required:
      - donationId
      - bloodTypeCode
      - componentCode
      - collectedAt
      - expiresAt
      properties:
        donationId:
          type: string
          format: uuid
        bloodTypeCode: *id001
        componentCode: *id001
        collectedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    UnitRelease:
      type: object
      required:
      - releaseDecision
      properties:
        releaseDecision:
          type: string
          enum:
          - RELEASED
          - REJECTED
        verificationNote: *id001
    ReservationCreate:
      type: object
      required:
      - bloodUnitId
      properties:
        bloodUnitId:
          type: string
          format: uuid
    FulfillmentCreate:
      type: object
      required:
      - requestId
      - bankId
      - reservationIds
      properties:
        requestId:
          type: string
          format: uuid
        bankId:
          type: integer
        reservationIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    FulfillmentStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - DISPATCHED
          - RECEIVED
          - CANCELLED
    CampCreate:
      type: object
      required:
      - title
      - organizerId
      - bloodBankId
      - locationId
      - startsAt
      - endsAt
      properties:
        title: *id001
        organizerId:
          type: integer
        bloodBankId:
          type: integer
        locationId:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        capacity:
          type: integer
        publicContact: *id001
    CampApproval:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        note: *id001
    CampRegistration:
      type: object
      properties: {}
    DonorMatchSearch:
      type: object
      properties:
        districtCode: *id001
        maxResults:
          type: integer
          minimum: 1
          maximum: 100
    PaginatedOk:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
